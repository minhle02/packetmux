name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: 6.0.6
  NODE_VERSION: "24"
  UV_PYTHON: "3.12"  # the oldest supported

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - run: uv run scripts/build.py wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wasm
          path: bindings/js/dist/
          if-no-files-found: error

  test:
    needs: wasm
    strategy:
      fail-fast: false  # a failure on one system should not hide the others
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # a stalled stream can spin forever in a test loop
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wasm
          path: bindings/js/dist

      - name: C++ tests
        run: |
          cmake -S . -B build/tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tests --config Release --parallel
          ctest --test-dir build/tests -C Release --output-on-failure

      - name: Install JS test dependencies
        working-directory: bindings/js
        run: npm install

      - name: Python tests
        working-directory: bindings/python/packetmux
        run: uv run pytest

      - name: JS tests
        working-directory: bindings/js
        run: npm test
