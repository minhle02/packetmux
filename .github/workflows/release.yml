name: Release

on:
  push:
    tags: ["v[0-9]*"]
    branches: [ci]  # dry run: builds everything, and publishes nothing

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: 6.0.6
  NODE_VERSION: "24"
  SMOKE_PYTHON: "3.12"

jobs:
  check-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The tag must match both packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json, os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("bindings/python/packetmux/pyproject.toml", "rb") as file:
              python = tomllib.load(file)["project"]["version"]
          with open("bindings/js/package.json") as file:
              js = json.load(file)["version"]
          if {tag} != {python, js}:
              sys.exit(f"tag {tag}, pyproject {python}, package.json {js}")
          PY

  test:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            name: linux-x64
          - runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            name: linux-arm64
          - runner: macos-latest
            name: macos-arm64
          - runner: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Build the wheel
        env:
          PACKETMUX_LINUX_TAG: ${{ matrix.container && 'manylinux_2_28' || 'linux' }}
        run: uv run scripts/build.py wheel

      - name: Check the wheel fits its manylinux tag
        if: matrix.container
        run: uvx auditwheel show build/packages/*.whl | tee /dev/stderr | grep -q 'manylinux_2_28'

      - name: Load the installed wheel
        run: |
          uv run --isolated --no-project --python "$SMOKE_PYTHON" --with build/packages/*.whl \
            python -c "from packetmux.core import config_defaults; assert config_defaults()['receive_window'] == 262144"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: build/packages/*.whl
          if-no-files-found: error

  npm:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - run: uv run scripts/build.py npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm
          path: build/packages/*.tgz
          if-no-files-found: error

  release:
    needs: [wheels, npm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write  # the only job that can change the repo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: packages
          merge-multiple: true
      - name: Add checksums
        working-directory: packages
        run: sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
